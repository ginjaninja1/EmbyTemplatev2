name: Handle Project Initialization

# Fires when the template is instantiated via the initial repository push
on:
  push:
    branches:
      - main
      - master

jobs:
  rename-project:
    if: github.repository != 'ginjaninja1/EmbyTemplatev2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      workflows: write  # Allows the bot to delete this workflow file safely

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Dynamically Rename Architecture
      run: |
        NEW_NAME="${{ github.event.repository.name }}"
        OLD_NAME="EmbyTemplatev2"
        
        echo "Renaming template from $OLD_NAME to $NEW_NAME..."

        # 1. Generate a unique lowercase GUID with hyphens (e.g., 6b2e4f17-9a3c-4d8b-8e1f-2c7a5b9d3e60)
        NEW_GUID=$(uuidgen)
        echo "Generated New Plugin GUID: $NEW_GUID"

        # 2. Find and replace the template name inside all code files
        find . -type f -not -path '*/.git/*' -exec sed -i "s/$OLD_NAME/$NEW_NAME/g" {} +

        # 3. Find and replace your exact GUID placeholder text
        find . -type f -not -path '*/.git/*' -exec sed -i "s/GENERATE_NEW_GUID_HERE/$NEW_GUID/g" {} +

        # 4. Rename the actual project and solution filenames
        mv src/$OLD_NAME/$OLD_NAME.csproj src/$OLD_NAME/$NEW_NAME.csproj
        mv src/$OLD_NAME/$OLD_NAME.slnx src/$OLD_NAME/$NEW_NAME.slnx

        # 5. Rename the child source directory to match your new plugin name
        mv src/$OLD_NAME src/$NEW_NAME

        # 6. Self-destruct this exact script so it never triggers again
        rm -rf .github/workflows/init-project.yml

    - name: Commit Changes to Single Source of Truth
      run: |
        # Mark the workspace as safe to resolve Node 24 strict Git ownership rules
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        
        git add .
        git commit -m "automation: dynamically initialized plugin layout and generated unique GUID"
        git push origin HEAD
